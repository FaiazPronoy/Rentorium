{% extends 'base.html' %}
{% block title %}Something went wrong &middot; {{ SITE_NAME }}{% endblock %}
{% block body %}
<main class="wrap-sm section">
  <div class="card empty" style="padding-block:4rem">
    <div class="big">{% icon "alert" %}</div>
    <h1>Something went wrong</h1>
    <p class="muted">The server had a problem. Please try again in a moment.</p>
    <div class="btn-group" style="justify-content:center">
      <a class="btn btn-primary" href="/">Back to home</a>
    </div>
  </div>
</main>
{% endblock %}
