{% extends 'base.html' %}
{% block title %}Questions &middot; {{ SITE_NAME }}{% endblock %}
{% block body %}
<main class="wrap-md section">
  <h1>Common questions</h1>
  <p class="muted">If yours is not here, <a href="{% url 'contact' %}">write to us</a>.</p>

  <div class="card">
    {% for f in faqs %}
      <details style="border-bottom:1px solid var(--border);padding:.8rem 0">
        <summary style="cursor:pointer;font-weight:800">{{ f.question }}</summary>
        <p class="small muted" style="margin:.6rem 0 0;white-space:pre-line">{{ f.answer }}</p>
      </details>
    {% empty %}
      <div class="empty"><p class="mb0">No questions have been published yet.</p></div>
    {% endfor %}
  </div>
</main>
{% endblock %}
