{% extends 'base.html' %}
{% block title %}Choose a new password &middot; {{ SITE_NAME }}{% endblock %}
{% block body %}
<main class="wrap-sm section">
  <div class="card">
    <h1>Choose a new password</h1>
    <form method="post" data-once>
      {% csrf_token %}
      {% for field in form %}{% include 'partials/_field.html' %}{% endfor %}
      <button class="btn btn-primary btn-block" type="submit">Save the new password</button>
    </form>
  </div>
</main>
{% endblock %}
