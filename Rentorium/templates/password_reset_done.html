{% extends 'base.html' %}
{% block title %}Check your email &middot; {{ SITE_NAME }}{% endblock %}
{% block body %}
<main class="wrap-sm section">
  <div class="card empty">
    <div class="big">{% icon "mail" %}</div>
    <h1>Check your email</h1>
    <p class="muted">If that address has an account, a reset link is on its way.
      It expires in a few hours.</p>
    <a class="btn btn-primary" href="{% url 'signin' %}">Back to sign in</a>
  </div>
</main>
{% endblock %}
